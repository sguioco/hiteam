name: Legacy VPS Deploy

on:
  workflow_dispatch:

concurrency:
  group: hiteam-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Sync repository on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            export GIT_TERMINAL_PROMPT=0

            cd /root/hiteam/repo
            echo "[sync] remote $(git remote get-url origin)"
            echo "[sync] fetch"
            git fetch origin --progress --verbose
            echo "[sync] reset"
            git reset --hard origin/main
            echo "[sync] clean"
            git clean -fd

            echo "[deploy] revision $(git rev-parse --short HEAD)"

      - name: Ensure Docker Compose on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            if docker compose version >/dev/null 2>&1; then
              docker compose version
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose version
            else
              arch="$(uname -m)"
              case "$arch" in
                x86_64|amd64) arch="x86_64" ;;
                aarch64|arm64) arch="aarch64" ;;
                *)
                  echo "Unsupported Docker Compose architecture: $arch"
                  exit 127
                  ;;
              esac

              url="https://github.com/docker/compose/releases/latest/download/docker-compose-linux-${arch}"
              if command -v curl >/dev/null 2>&1; then
                curl -fsSL "$url" -o /usr/local/bin/docker-compose
              elif command -v wget >/dev/null 2>&1; then
                wget -qO /usr/local/bin/docker-compose "$url"
              else
                echo "Neither curl nor wget is available to install Docker Compose"
                exit 127
              fi

              chmod +x /usr/local/bin/docker-compose
              docker-compose version
            fi

            cat > /usr/local/bin/hiteam-compose-prod <<'SCRIPT'
            #!/usr/bin/env bash
            set -euo pipefail

            cd /root/hiteam/repo

            if docker compose version >/dev/null 2>&1; then
              compose=(docker compose)
            elif command -v docker-compose >/dev/null 2>&1; then
              compose=(docker-compose)
            else
              echo "Docker Compose is not available" >&2
              exit 127
            fi

            if [ -f /root/hiteam/.env ]; then
              export HITEAM_ENV_FILE=/root/hiteam/.env
            elif [ -f .env.local ]; then
              export HITEAM_ENV_FILE=.env.local
            else
              echo "Missing /root/hiteam/.env for legacy VPS deploy" >&2
              exit 1
            fi

            exec "${compose[@]}" --env-file "$HITEAM_ENV_FILE" -p hiteam -f docker-compose.prod.yml "$@"
            SCRIPT

            sed -i 's/^            //' /usr/local/bin/hiteam-compose-prod
            chmod +x /usr/local/bin/hiteam-compose-prod
            /usr/local/bin/hiteam-compose-prod config --services

      - name: Prisma push on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            export COMPOSE_DOCKER_CLI_BUILD=1
            export DOCKER_BUILDKIT=1
            export BUILDKIT_PROGRESS=plain

            hiteam-compose-prod build api
            hiteam-compose-prod run --rm prisma

      - name: Build API image on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          command_timeout: 45m
          script: |
            set -euo pipefail

            export COMPOSE_DOCKER_CLI_BUILD=1
            export DOCKER_BUILDKIT=1
            export BUILDKIT_PROGRESS=plain

            hiteam-compose-prod build api

      - name: Build Web Admin image on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          command_timeout: 60m
          script: |
            set -euo pipefail

            export COMPOSE_DOCKER_CLI_BUILD=1
            export DOCKER_BUILDKIT=1
            export BUILDKIT_PROGRESS=plain

            hiteam-compose-prod build web-admin

      - name: Restart services on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          command_timeout: 15m
          script: |
            set -euo pipefail

            hiteam-compose-prod up -d api web-admin
