name: Build Images For ArgoCD

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: hiteam-argocd-release-${{ github.event.workflow_run.head_sha || github.sha }}
  # A manual release and the CI follow-up can target the same SHA.  Queue them
  # instead of dropping one halfway through image build or ArgoCD patching.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/hiteam-api:main-${{ github.event.workflow_run.head_sha || github.sha }}
  API_IMAGE_LATEST: ghcr.io/${{ github.repository_owner }}/hiteam-api:main-latest
  WEB_ADMIN_IMAGE: ghcr.io/${{ github.repository_owner }}/hiteam-web-admin:main-${{ github.event.workflow_run.head_sha || github.sha }}
  WEB_ADMIN_IMAGE_LATEST: ghcr.io/${{ github.repository_owner }}/hiteam-web-admin:main-latest
  WEB_ADMIN_PUBLIC_API_URL: ${{ vars.ARGOCD_WEB_ADMIN_PUBLIC_API_URL }}
  WEB_ADMIN_PUBLIC_GRAPHQL_URL: ${{ vars.ARGOCD_WEB_ADMIN_PUBLIC_GRAPHQL_URL }}
  WEB_ADMIN_BASE_URL: ${{ vars.ARGOCD_WEB_ADMIN_BASE_URL }}
  WEB_ADMIN_GOOGLE_MAPS_API_KEY: ${{ vars.ARGOCD_WEB_ADMIN_GOOGLE_MAPS_API_KEY }}
  WEB_ADMIN_GOOGLE_MAPS_MAP_ID: ${{ vars.ARGOCD_WEB_ADMIN_GOOGLE_MAPS_MAP_ID }}
  # Configure as a GitHub Actions repository variable: 0 = full release, 1 = only affected images.
  FAST_DEPLOY: ${{ vars.FAST_DEPLOY || '0' }}

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_deploy: ${{ steps.changes.outputs.deploy }}
      build_api: ${{ steps.changes.outputs.build_api }}
      build_web_admin: ${{ steps.changes.outputs.build_web_admin }}
      fast_deploy: ${{ steps.changes.outputs.fast_deploy }}
    steps:
      - name: Validate required repo variables
        run: |
          set -euo pipefail

          missing=0

          if [ -z "${WEB_ADMIN_PUBLIC_API_URL}" ]; then
            echo "Missing repo variable ARGOCD_WEB_ADMIN_PUBLIC_API_URL"
            missing=1
          fi

          if [ -z "${WEB_ADMIN_PUBLIC_GRAPHQL_URL}" ]; then
            echo "Missing repo variable ARGOCD_WEB_ADMIN_PUBLIC_GRAPHQL_URL"
            missing=1
          fi

          if [ -z "${WEB_ADMIN_BASE_URL}" ]; then
            echo "Missing repo variable ARGOCD_WEB_ADMIN_BASE_URL"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 2

      - name: Detect deploy-relevant changes
        id: changes
        run: |
          set -euo pipefail

          files="$(git diff --name-only HEAD~1 HEAD)"
          if [ -z "$files" ]; then
            if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ "${FAST_DEPLOY}" != '1' ]; then
              echo "Manual standard release requested without changed files: forcing both images."
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              echo "build_api=true" >> "$GITHUB_OUTPUT"
              echo "build_web_admin=true" >> "$GITHUB_OUTPUT"
              echo "fast_deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "No changed files detected; skipping release."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "build_api=false" >> "$GITHUB_OUTPUT"
            echo "build_web_admin=false" >> "$GITHUB_OUTPUT"
            echo "fast_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$files"

          deploy=false
          build_api=false
          build_web_admin=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*|altegio-docs/*|README.md|PRD.md|AGENTS.md|.cd/values.hiteam-main.yaml|.cd/values.hiteam-main.example.yaml|.cd/argocd-application.example.yaml)
                ;;
              apps/api/*)
                deploy=true
                build_api=true
                ;;
              apps/web-admin/*)
                deploy=true
                build_web_admin=true
                ;;
              apps/mobile/*)
                # Mobile is released via EAS; it does not require an API/web image.
                ;;
              packages/types/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.base.json|turbo.json|.npmrc|Dockerfile|.cd/*)
                deploy=true
                build_api=true
                build_web_admin=true
                ;;
              *)
                deploy=true
                build_api=true
                build_web_admin=true
                ;;
            esac
          done <<< "$files"

          if [ "$deploy" = false ]; then
            echo "Only docs or runtime values changed; skipping image build and deploy."
          fi

          if [ "${FAST_DEPLOY}" = '1' ]; then
            echo "Fast deploy enabled: api=$build_api web-admin=$build_web_admin"
          else
            echo "Standard deploy enabled: building both images."
            if [ "$deploy" = true ]; then
              build_api=true
              build_web_admin=true
            fi
          fi

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "build_api=$build_api" >> "$GITHUB_OUTPUT"
          echo "build_web_admin=$build_web_admin" >> "$GITHUB_OUTPUT"
          echo "fast_deploy=$([ "${FAST_DEPLOY}" = '1' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build-api:
    needs: gate
    if: needs.gate.outputs.build_api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}
            ${{ env.API_IMAGE_LATEST }}
          cache-from: type=gha,scope=hiteam-api
          cache-to: type=gha,mode=max,scope=hiteam-api

  build-web-admin:
    needs: gate
    if: needs.gate.outputs.build_web_admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web Admin image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web-admin/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.WEB_ADMIN_PUBLIC_API_URL }}
            NEXT_PUBLIC_GRAPHQL_URL=${{ env.WEB_ADMIN_PUBLIC_GRAPHQL_URL }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ env.WEB_ADMIN_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${{ env.WEB_ADMIN_GOOGLE_MAPS_MAP_ID }}
            NEXT_PUBLIC_WEB_ADMIN_BASE_URL=${{ env.WEB_ADMIN_BASE_URL }}
          tags: |
            ${{ env.WEB_ADMIN_IMAGE }}
            ${{ env.WEB_ADMIN_IMAGE_LATEST }}
          cache-from: type=gha,scope=hiteam-web-admin
          cache-to: type=gha,mode=max,scope=hiteam-web-admin

  deploy:
    needs: [gate, build-api, build-web-admin]
    if: >-
      always() && needs.gate.outputs.should_deploy == 'true' &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (needs.build-web-admin.result == 'success' || needs.build-web-admin.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy new images via Argo application override
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          command_timeout: 25m
          script: |
            set -euo pipefail

            build_api='${{ needs.gate.outputs.build_api }}'
            build_web_admin='${{ needs.gate.outputs.build_web_admin }}'

            # This command runs on the production host through SSH. Keep it
            # self-contained: the host has kubectl but does not guarantee jq.
            current_api_image="$(kubectl -n argocd get application hiteam-main -o go-template='{{range .spec.source.helm.parameters}}{{if eq .name "api.image"}}{{.value}}{{end}}{{end}}')"
            current_web_admin_image="$(kubectl -n argocd get application hiteam-main -o go-template='{{range .spec.source.helm.parameters}}{{if eq .name "webAdmin.image"}}{{.value}}{{end}}{{end}}')"

            api_image="${current_api_image:-${{ env.API_IMAGE }}}"
            web_admin_image="${current_web_admin_image:-${{ env.WEB_ADMIN_IMAGE }}}"

            if [ "$build_api" = 'true' ]; then
              api_image='${{ env.API_IMAGE }}'
            fi
            if [ "$build_web_admin" = 'true' ]; then
              web_admin_image='${{ env.WEB_ADMIN_IMAGE }}'
            fi

            echo "Deploying api=${api_image} web-admin=${web_admin_image}"

            kubectl -n argocd patch application hiteam-main --type merge -p '{
              "spec": {
                "source": {
                  "helm": {
                    "parameters": [
                      {"name":"api.image","value":"'"${api_image}"'"},
                      {"name":"webAdmin.image","value":"'"${web_admin_image}"'"}
                    ]
                  }
                }
              }
            }'

            kubectl -n argocd annotate application hiteam-main argocd.argoproj.io/refresh=hard --overwrite

            for attempt in $(seq 1 180); do
              sync_status="$(kubectl -n argocd get application hiteam-main -o jsonpath='{.status.sync.status}')"
              health_status="$(kubectl -n argocd get application hiteam-main -o jsonpath='{.status.health.status}')"
              operation_phase="$(kubectl -n argocd get application hiteam-main -o jsonpath='{.status.operationState.phase}')"

              echo "[argocd] attempt=${attempt} sync=${sync_status:-unknown} health=${health_status:-unknown} operation=${operation_phase:-none}"

              if [ "${operation_phase:-}" = "Failed" ] || [ "${operation_phase:-}" = "Error" ]; then
                kubectl -n hiteam-main logs job/hiteam-migrations --all-containers=true || true
                kubectl -n hiteam-main describe job/hiteam-migrations || true
                kubectl -n argocd get application hiteam-main -o yaml
                exit 1
              fi

              if [ "${sync_status:-}" = "Synced" ] && [ "${health_status:-}" = "Healthy" ]; then
                exit 0
              fi

              sleep 5
            done

            echo "[argocd] deployment did not become Synced/Healthy in time"
            kubectl -n hiteam-main logs job/hiteam-migrations --all-containers=true || true
            kubectl -n hiteam-main describe job/hiteam-migrations || true
            kubectl -n argocd get application hiteam-main -o yaml
            exit 1

  skip:
    needs: gate
    if: needs.gate.outputs.should_deploy != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release skipped because only docs or runtime values changed."
