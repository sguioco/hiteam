name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".cd/values.hiteam-main.yaml"
      - ".cd/values.hiteam-main.example.yaml"
      - ".cd/argocd-application.example.yaml"
      - "docs/**"
      - "altegio-docs/**"
      - "README.md"
      - "PRD.md"
      - "AGENTS.md"
  pull_request:
    paths-ignore:
      - ".cd/values.hiteam-main.yaml"
      - ".cd/values.hiteam-main.example.yaml"
      - ".cd/argocd-application.example.yaml"
      - "docs/**"
      - "altegio-docs/**"
      - "README.md"
      - "PRD.md"
      - "AGENTS.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
