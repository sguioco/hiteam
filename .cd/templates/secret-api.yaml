{{- if .Values.api.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: envs-api
  namespace: {{ .Release.Namespace }}
  labels:
    project: {{ .Values.sharedInfo.project.name }}
    branch: {{ .Values.sharedInfo.project.branch }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  PORT: {{ .Values.api.env.PORT | quote }}
  NODE_ENV: {{ .Values.api.env.NODE_ENV | quote }}
  API_PUBLIC_URL: {{ required "Set api.env.API_PUBLIC_URL or ingress.backend.host" (include "hiteam.publicApiUrl" .) | quote }}
  FRONTEND_URL: {{ required "Set api.env.FRONTEND_URL or ingress.frontend.host" (default (include "hiteam.publicFrontendUrl" .) .Values.api.env.FRONTEND_URL) | quote }}
  WEB_ADMIN_BASE_URL: {{ required "Set api.env.WEB_ADMIN_BASE_URL or ingress.frontend.host" (default (include "hiteam.publicFrontendUrl" .) .Values.api.env.WEB_ADMIN_BASE_URL) | quote }}
  {{- if or .Values.api.env.DATABASE_URL .Values.postgres.enabled }}
  DATABASE_URL: {{ required "Set api.env.DATABASE_URL or enable postgres" (include "hiteam.databaseUrl" .) | quote }}
  {{- end }}
  {{- if or .Values.api.env.REDIS_URL .Values.redis.enabled }}
  REDIS_URL: {{ required "Set api.env.REDIS_URL or enable redis" (include "hiteam.redisUrl" .) | quote }}
  {{- end }}
  S3_ENDPOINT: {{ required "Set api.env.S3_ENDPOINT or enable minio" (include "hiteam.s3Endpoint" .) | quote }}
  S3_REGION: {{ .Values.api.env.S3_REGION | quote }}
  {{- if or .Values.api.env.S3_ACCESS_KEY .Values.minio.enabled }}
  S3_ACCESS_KEY: {{ required "Set api.env.S3_ACCESS_KEY or enable minio" (include "hiteam.s3AccessKey" .) | quote }}
  {{- end }}
  {{- if or .Values.api.env.S3_SECRET_KEY .Values.minio.enabled }}
  S3_SECRET_KEY: {{ required "Set api.env.S3_SECRET_KEY or enable minio" (include "hiteam.s3SecretKey" .) | quote }}
  {{- end }}
  S3_BUCKET: {{ required "Set api.env.S3_BUCKET or enable minio" (include "hiteam.s3Bucket" .) | quote }}
  S3_PUBLIC_BASE_URL: {{ include "hiteam.s3PublicBaseUrl" . | quote }}
  {{- if .Values.api.env.GOOGLE_OAUTH_CLIENT_ID }}
  GOOGLE_OAUTH_CLIENT_ID: {{ .Values.api.env.GOOGLE_OAUTH_CLIENT_ID | quote }}
  {{- end }}
  {{- if .Values.api.env.GOOGLE_OAUTH_CLIENT_SECRET }}
  GOOGLE_OAUTH_CLIENT_SECRET: {{ .Values.api.env.GOOGLE_OAUTH_CLIENT_SECRET | quote }}
  {{- end }}
  GOOGLE_OAUTH_REDIRECT_URI: {{ .Values.api.env.GOOGLE_OAUTH_REDIRECT_URI | quote }}
  {{- if .Values.api.env.GOOGLE_OAUTH_STATE_SECRET }}
  GOOGLE_OAUTH_STATE_SECRET: {{ .Values.api.env.GOOGLE_OAUTH_STATE_SECRET | quote }}
  {{- end }}
  {{- if .Values.api.env.JWT_ACCESS_SECRET }}
  JWT_ACCESS_SECRET: {{ required "Set api.env.JWT_ACCESS_SECRET" .Values.api.env.JWT_ACCESS_SECRET | quote }}
  {{- end }}
  {{- if .Values.api.env.JWT_REFRESH_SECRET }}
  JWT_REFRESH_SECRET: {{ required "Set api.env.JWT_REFRESH_SECRET" .Values.api.env.JWT_REFRESH_SECRET | quote }}
  {{- end }}
  JWT_ACCESS_EXPIRES_IN: {{ .Values.api.env.JWT_ACCESS_EXPIRES_IN | quote }}
  JWT_REFRESH_EXPIRES_IN: {{ .Values.api.env.JWT_REFRESH_EXPIRES_IN | quote }}
  BIOMETRIC_PROVIDER: {{ .Values.api.env.BIOMETRIC_PROVIDER | quote }}
  COMPRE_FACE_BASE_URL: {{ required "Set api.env.COMPRE_FACE_BASE_URL or enable compreface" (include "hiteam.compreFaceBaseUrl" .) | quote }}
  {{- if .Values.api.env.COMPRE_FACE_API_KEY }}
  COMPRE_FACE_API_KEY: {{ required "Set api.env.COMPRE_FACE_API_KEY" .Values.api.env.COMPRE_FACE_API_KEY | quote }}
  {{- end }}
  COMPRE_FACE_SIMILARITY_THRESHOLD: {{ .Values.api.env.COMPRE_FACE_SIMILARITY_THRESHOLD | quote }}
  COMPRE_FACE_TIMEOUT_MS: {{ .Values.api.env.COMPRE_FACE_TIMEOUT_MS | quote }}
  AWS_REGION: {{ .Values.api.env.AWS_REGION | quote }}
  {{- if .Values.api.env.AWS_ACCESS_KEY_ID }}
  AWS_ACCESS_KEY_ID: {{ .Values.api.env.AWS_ACCESS_KEY_ID | quote }}
  {{- end }}
  {{- if .Values.api.env.AWS_SECRET_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.api.env.AWS_SECRET_ACCESS_KEY | quote }}
  {{- end }}
  AWS_REKOGNITION_SIMILARITY_THRESHOLD: {{ .Values.api.env.AWS_REKOGNITION_SIMILARITY_THRESHOLD | quote }}
  AWS_BIOMETRIC_ASSUME_ROLE_ARN: {{ .Values.api.env.AWS_BIOMETRIC_ASSUME_ROLE_ARN | quote }}
  AWS_BIOMETRIC_SESSION_DURATION_SECONDS: {{ .Values.api.env.AWS_BIOMETRIC_SESSION_DURATION_SECONDS | quote }}
  AWS_BIOMETRIC_EXTERNAL_ID: {{ .Values.api.env.AWS_BIOMETRIC_EXTERNAL_ID | quote }}
  LIBRETRANSLATE_URL: {{ .Values.api.env.LIBRETRANSLATE_URL | quote }}
  {{- if .Values.api.env.LIBRETRANSLATE_API_KEY }}
  LIBRETRANSLATE_API_KEY: {{ .Values.api.env.LIBRETRANSLATE_API_KEY | quote }}
  {{- end }}
  {{- if .Values.api.env.EXPO_ACCESS_TOKEN }}
  EXPO_ACCESS_TOKEN: {{ .Values.api.env.EXPO_ACCESS_TOKEN | quote }}
  {{- end }}
  {{- if .Values.api.env.SYSTEM_SECRET }}
  SYSTEM_SECRET: {{ required "Set api.env.SYSTEM_SECRET" .Values.api.env.SYSTEM_SECRET | quote }}
  {{- end }}
  {{- if .Values.api.env.HI_TEAM_INTERNAL_ACCESS_KEY }}
  HI_TEAM_INTERNAL_ACCESS_KEY: {{ required "Set api.env.HI_TEAM_INTERNAL_ACCESS_KEY" .Values.api.env.HI_TEAM_INTERNAL_ACCESS_KEY | quote }}
  {{- end }}
  {{- if .Values.api.env.STRIPE_SECRET_KEY }}
  STRIPE_SECRET_KEY: {{ .Values.api.env.STRIPE_SECRET_KEY | quote }}
  {{- end }}
  {{- if .Values.api.env.STRIPE_PUBLISHABLE_KEY }}
  STRIPE_PUBLISHABLE_KEY: {{ .Values.api.env.STRIPE_PUBLISHABLE_KEY | quote }}
  {{- end }}
  {{- if .Values.api.env.STRIPE_WEBHOOK_SECRET }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.api.env.STRIPE_WEBHOOK_SECRET | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_ENABLED }}
  KOMMO_ENABLED: {{ .Values.api.env.KOMMO_ENABLED | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_SUBDOMAIN }}
  KOMMO_SUBDOMAIN: {{ .Values.api.env.KOMMO_SUBDOMAIN | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_BASE_URL }}
  KOMMO_BASE_URL: {{ .Values.api.env.KOMMO_BASE_URL | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_LONG_LIVED_TOKEN }}
  KOMMO_LONG_LIVED_TOKEN: {{ .Values.api.env.KOMMO_LONG_LIVED_TOKEN | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_ACCESS_TOKEN }}
  KOMMO_ACCESS_TOKEN: {{ .Values.api.env.KOMMO_ACCESS_TOKEN | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_REFRESH_TOKEN }}
  KOMMO_REFRESH_TOKEN: {{ .Values.api.env.KOMMO_REFRESH_TOKEN | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_CLIENT_ID }}
  KOMMO_CLIENT_ID: {{ .Values.api.env.KOMMO_CLIENT_ID | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_CLIENT_SECRET }}
  KOMMO_CLIENT_SECRET: {{ .Values.api.env.KOMMO_CLIENT_SECRET | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_REDIRECT_URI }}
  KOMMO_REDIRECT_URI: {{ .Values.api.env.KOMMO_REDIRECT_URI | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_PIPELINE_NAME }}
  KOMMO_PIPELINE_NAME: {{ .Values.api.env.KOMMO_PIPELINE_NAME | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_PIPELINE_ID }}
  KOMMO_PIPELINE_ID: {{ .Values.api.env.KOMMO_PIPELINE_ID | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_RESPONSIBLE_USER_ID }}
  KOMMO_RESPONSIBLE_USER_ID: {{ .Values.api.env.KOMMO_RESPONSIBLE_USER_ID | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_TRIAL_DAYS }}
  KOMMO_TRIAL_DAYS: {{ .Values.api.env.KOMMO_TRIAL_DAYS | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_EVENT_NOTES_ENABLED }}
  KOMMO_EVENT_NOTES_ENABLED: {{ .Values.api.env.KOMMO_EVENT_NOTES_ENABLED | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_WEBHOOK_SECRET }}
  KOMMO_WEBHOOK_SECRET: {{ .Values.api.env.KOMMO_WEBHOOK_SECRET | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_DEFAULT_INDUSTRY }}
  KOMMO_DEFAULT_INDUSTRY: {{ .Values.api.env.KOMMO_DEFAULT_INDUSTRY | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_DEFAULT_REFERRAL_SOURCE }}
  KOMMO_DEFAULT_REFERRAL_SOURCE: {{ .Values.api.env.KOMMO_DEFAULT_REFERRAL_SOURCE | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_SALES_MANAGER_NAME }}
  KOMMO_SALES_MANAGER_NAME: {{ .Values.api.env.KOMMO_SALES_MANAGER_NAME | quote }}
  {{- end }}
  {{- if .Values.api.env.KOMMO_ONBOARDING_MANAGER_NAME }}
  KOMMO_ONBOARDING_MANAGER_NAME: {{ .Values.api.env.KOMMO_ONBOARDING_MANAGER_NAME | quote }}
  {{- end }}
{{- end }}
